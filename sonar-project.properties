# ===== ข้อมูลโปรเจกต์ =====
sonar.projectKey=bot-system
sonar.projectName=BOT System
sonar.sourceEncoding=UTF-8

# ===== โค้ดที่จะสแกน =====
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# ===== รายงาน coverage จาก Jest (ไฟล์ lcov) =====
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# ===== ไม่สแกนเลย (ไม่ใช่ซอร์สของเรา) =====
sonar.exclusions=node_modules/**,dist/**,coverage/**,testing-kit/**,**/*.spec.ts

# ===== สแกนหาบั๊ก/ช่องโหว่ แต่ "ไม่นับ coverage" =====
# ไฟล์ที่ไม่มี business logic ตามที่อาจารย์บอก (bootstrap/config/โครงสร้าง)
sonar.coverage.exclusions=src/main.ts,**/*.module.ts,**/*.schema.ts,**/dto/**,**/interfaces/**,**/*.spec.ts
